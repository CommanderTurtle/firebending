[package]
name = "reh"
version = "0.1.0"
edition = "2021"
description = "Reverse Engineer HyperFrames: prune a composed mp4 into a deliberate frame library"
license = "AGPL-3.0-only"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustfft = "6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
